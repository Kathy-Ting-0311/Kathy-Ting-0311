<!DOCTYPE html>
<html>
    <title>Register</title>
    <meta name="author" content="HUANG JIAN TING s235065">
    <link rel="stylesheet" href="s235065.css">
<body>

  <form>
    <div class="container">
      <h1>User Register</h1>
      <p class="introduce">Welcome to join us</p>
      <p class="createAcc">Please fill in this form to create an account.</p>
      <hr>

    
      <label for="SID"><b>Student ID:</b></label><br>
      <input type="text" placeholder="Enter Student ID" name="SID" id="SID" required><br>
    
      <label for="psw"><b>Password:</b></label><br>
      <input type="password" placeholder="Enter Password" name="psw" id="psw" required><br>
        
      <label for="brithday"><b>Date of birth: </b></label><br>
      <input type="date" id="birthday" name="birthday"><br>
      
      <label><b>Programme:</b></label><br>
      
      <div class="ProName">
        <input type="radio" id="BBA" name="programme" value="BBA">
        <label class="Option1" for="BBA">BBA</label>
        
        <input type="radio" id="BA" name="programme" value="BA">
        <label class="Option2" for="BA">BA</label>
        
        <input type="radio" id="BSc" name="programme" value="BSc">
        <label class="Option3" for="BSc">BSc</label>
        
        <input type="radio" id="BEng" name="programme" value="BEng">
        <label class="Option4" for="BEng">BEng</label><br>
      </div>

      <label><b>Year (Year 1 - Year 4): </b></label>
      <input type="number" id="Year" name="Year" min="1" max="4"><br>

      <p><b>Where the student learns about the "Carnival"?</b></p>
      
      <div class="Checkpoint">
        <input type="checkbox" id="info1" name="info" value="HSU Webside">
        <label for="HSU Webside">HSU Webside</label>
        
        <input type="checkbox" id="info2" name="info2" value="Friend">
        <label for="Friend"> Friend</label>
        
        <input type="checkbox" id="info3" name="info3" value="Teachers">
        <label for="inofo3">Teachers</label>
        
        <input type="checkbox" id="info4" name="info4" value="Others">
        <label for="inofo4">Others</label>
      </div>
      
      <!-- <input type="submit" value="Submit"><br> -->
      
      <hr>
      
      <p class="text1">By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>

      <button type="submit" class="registerbtn"><b>Register</b></button>
      <p class="text2">Already have an account? <a href="#">Sign in</a>.</p>
    
    </div>

  </form>

</body>
</html>
